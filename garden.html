<head><script>try{if(localStorage.getItem('yy_unlocked')==='1'){document.documentElement.removeAttribute('data-yy-locked')}else{document.documentElement.setAttribute('data-yy-locked','')}}catch(e){document.documentElement.setAttribute('data-yy-locked','')}</script><style>[data-yy-locked] body>*:not(#yy-gate){visibility:hidden}</style>

<style>
:root{--ink:#53616a;--muted:#84919a;--pink:#e9b8cd;--blue:#c8e1e9;--green:#d7e4d5;--paper:rgba(255,255,255,.88)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#e8f0f4;color:var(--ink);min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:680px;min-height:100vh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(160deg,#e9f1f4 0%,#f7edf2 55%,#edf2e9 100%)}
.bg-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25;pointer-events:none}
.content{position:relative;z-index:1;padding:20px 16px 110px}
.header{text-align:center;padding:40px 12px 12px}
.title{font-size:29px;font-weight:650;letter-spacing:4px;color:#52616a;text-shadow:0 2px 8px #fff}
.subtitle{font-size:14px;color:#7e8b91;margin-top:10px;letter-spacing:1px}
.input-area{display:flex;gap:10px;max-width:460px;margin:28px auto 22px}
.input-area input{min-width:0;flex:1;padding:14px 18px;border:1.5px solid rgba(184,168,216,.5);border-radius:28px;background:rgba(255,255,255,.88);color:#59636a;font-size:16px;outline:none}
.input-area input:focus{border-color:#b8a8d8;box-shadow:0 3px 14px #b8a8d833}
.release-btn,.primary{border:0;border-radius:26px;padding:13px 23px;background:linear-gradient(135deg,#f3c9da,#dfb8d0);color:white;font-weight:650;box-shadow:0 4px 12px #e9b8cd55}
.release-btn:active,.primary:active,.dock-button:active{transform:scale(.97)}
.canvas-container{position:relative;width:100%;height:350px;border-radius:25px;background:rgba(255,255,255,.38);border:1.5px dashed rgba(166,190,202,.65);overflow:hidden;backdrop-filter:blur(3px)}
canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.hint{text-align:center;font-size:13px;color:#849099;padding:14px 8px}
.float-text{position:absolute;font-size:20px;color:#59656d;pointer-events:none;white-space:normal;max-width:180px;text-align:center;line-height:1.4;font-weight:550;text-shadow:0 1px 4px #fff;transform:translateX(-50%);animation:floatUp 4s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-100px)}}
.dock{position:fixed;z-index:5;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(92%,440px);display:flex;align-items:center;justify-content:space-around;padding:9px 10px;border:1px solid #ffffffc9;border-radius:25px;background:rgba(255,255,255,.82);box-shadow:0 8px 28px #62778322;backdrop-filter:blur(16px)}
.dock-button{border:0;background:transparent;color:#697780;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:62px;padding:4px 7px;font-size:11px}
.dock-button .ico{font-size:22px;line-height:1.1}
.dock-button.active{color:#c17f9f}
.overlay{position:fixed;z-index:10;inset:0;background:rgba(54,68,76,.28);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;padding:12px}
.overlay.show{display:flex}
.panel{width:min(100%,620px);max-height:86vh;overflow:auto;background:rgba(250,252,251,.97);border:1px solid #fff;border-radius:26px 26px 20px 20px;box-shadow:0 15px 50px #34465030;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.panel-title{font-size:20px;font-weight:650;color:#53636b}
.close{width:34px;height:34px;border:0;border-radius:50%;background:#edf1f1;color:#718087;font-size:20px}
.plugin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plugin-card{border:1px solid #e7eded;border-radius:18px;background:linear-gradient(145deg,#fff,#f5f8f7);padding:17px 8px;text-align:center;color:#65747b;box-shadow:0 3px 10px #82949a0d}
.plugin-card:active{transform:scale(.97)}
.plugin-card .big{font-size:28px;display:block;margin-bottom:7px}
.plugin-card strong{font-size:13px}
.plugin-card small{display:block;color:#9aa5a9;font-size:10px;margin-top:5px}
textarea,.text-input{width:100%;border:1px solid #dfe8e8;border-radius:15px;background:#fff;padding:13px;color:#53616a;outline:none;resize:vertical}
textarea:focus,.text-input:focus{border-color:#b9d3d9}
textarea{min-height:120px;line-height:1.6}
.action-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.secondary{border:1px solid #dce7e7;border-radius:22px;padding:10px 16px;background:#fff;color:#6e7d83}
.primary{padding:10px 18px}
.list{display:flex;flex-direction:column;gap:10px}
.entry{background:#fff;border:1px solid #e8eeee;border-radius:15px;padding:13px 14px;line-height:1.55;overflow-wrap:anywhere}
.entry time{display:block;color:#a0aaad;font-size:11px;margin-bottom:5px}
.entry-actions{display:flex;justify-content:flex-end;margin-top:8px}
.entry-actions button{border:0;background:transparent;color:#b1849b;font-size:12px;padding:3px 6px}
.empty{text-align:center;padding:28px 10px;color:#a0aaad;font-size:13px}
.quote-card{border-radius:20px;padding:25px 20px;background:linear-gradient(135deg,#f8e8ee,#e8f1f3);text-align:center;line-height:1.8;color:#68767c;font-size:17px}
.note{font-size:12px;color:#9aa5a9;line-height:1.6;margin-top:12px}
@media(min-width:600px){.content{padding-left:28px;padding-right:28px}.canvas-container{height:390px}}
</style>
</head>
<body><script>
(function(){
  var UNLOCK_KEY='yy_unlocked';
  var HASH='b5c421dd84a0cf6bee896d6c16dbb5ba849c62122f7f6e4beaee6d4cbc7afdf8';
  function isUnlocked(){try{return localStorage.getItem(UNLOCK_KEY)==='1'}catch(e){return false}}
  function unlock(){try{localStorage.setItem(UNLOCK_KEY,'1')}catch(e){};document.documentElement.removeAttribute('data-yy-locked');var g=document.getElementById('yy-gate');if(g&&g.parentNode)g.parentNode.removeChild(g)}
  function hex(b){var a=new Uint8Array(b),s='';for(var i=0;i<a.length;i++)s+=('0'+a[i].toString(16)).slice(-2);return s}
  function gate(){
    if(document.getElementById('yy-gate'))return;
    var g=document.createElement('div');g.id='yy-gate';
    g.setAttribute('style','position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background-color:#f6f4ed;background-image:radial-gradient(#d5d8cf 1px,transparent 1px);background-size:20px 20px;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent');
    g.innerHTML='<div style="width:min(300px,88vw);background:#fffefa;border:1px solid #e0e4d9;border-radius:18px;padding:26px 22px;box-shadow:0 12px 34px rgba(78,98,75,.14);text-align:center">'+
      '<div style="font-size:13px;letter-spacing:4px;color:#a8ada2;margin-bottom:6px">YOUYOU</div>'+
      '<div style="font-size:18px;letter-spacing:2px;color:#4e624b;font-weight:600;margin-bottom:16px">幽幽的小窝</div>'+
      '<input id="yy-pw" type="password" placeholder="密码" autocomplete="off" style="width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid #e0e4d9;border-radius:12px;font-size:15px;outline:none;background:#fff;color:#394439" />'+
      '<button id="yy-go" type="button" style="width:100%;margin-top:12px;padding:11px;border:none;border-radius:12px;background:#788b72;color:#fff;font-size:15px;letter-spacing:2px;cursor:pointer">进 入</button>'+
      '<div id="yy-err" style="margin-top:9px;font-size:12px;color:#c97c7c;min-height:17px"></div>'+
      '</div>';
    document.body.appendChild(g);
    var pw=document.getElementById('yy-pw'),err=document.getElementById('yy-err');
    function check(){
      var v=pw.value||'';
      if(!v){err.textContent='先输入密码哦';return;}
      if(!window.crypto||!window.crypto.subtle){err.textContent='请用 https 打开这个页面';return;}
      crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(b){
        if(hex(b)===HASH){unlock()}else{err.textContent='密码不对，再想想 :)';pw.value='';pw.focus()}
      }).catch(function(){err.textContent='出错了，刷新试试'});
    }
    document.getElementById('yy-go').addEventListener('click',check);
    pw.addEventListener('keydown',function(e){if(e.key==='Enter')check()});
    setTimeout(function(){try{pw.focus()}catch(e){}},60);
  }
  if(isUnlocked()){
    if(document.documentElement.hasAttribute('data-yy-locked'))document.documentElement.removeAttribute('data-yy-locked');
    return;
  }
  if(document.body){gate()}else{document.addEventListener('DOMContentLoaded',gate)}
})();
</script>
<div class="app">
  <img class="bg-image" src="img/01.jpg" alt="" onerror="this.style.display='none'">
  <main class="content">
    <header class="header"><h1 class="title">情绪树洞</h1><p class="subtitle">把心事写下来，让它飘走</p></header>
    <div class="input-area">
      <input type="text" id="thoughtInput" placeholder="此刻在想什么..." maxlength="50" autocomplete="off">
      <button class="release-btn" id="releaseBtn">放飞</button>
    </div>
    <div class="canvas-container" id="canvasContainer"><canvas id="starCanvas"></canvas></div>
    <p class="hint">写下的东西会化成星星，点击星星可以让它消失</p>
  </main>
  <nav class="dock" aria-label="小花园菜单">
    <button class="dock-button active" data-open="home"><span class="ico">✦</span>树洞</button>
    <button class="dock-button" data-open="plugins"><span class="ico">▦</span>小插件</button>
    <button class="dock-button" data-open="diary"><span class="ico">📖</span>日记</button>
    <button class="dock-button" data-open="saved"><span class="ico">⭐</span>星星</button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-head"><h2 class="panel-title" id="panelTitle">小插件</h2><button class="close" id="closePanel" aria-label="关闭">×</button></div>
    <div id="panelBody"></div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('starCanvas'), ctx = canvas.getContext('2d');
  const input = $('thoughtInput'), canvasBox = $('canvasContainer');
  const overlay = $('overlay'), panelTitle = $('panelTitle'), panelBody = $('panelBody');
  const STORE = {diary:'yoyo_emotion_diary_v1', saved:'yoyo_emotion_stars_v1', letters:'yoyo_emotion_letters_v1'};
  let stars = [], particles = [], dpr = 1;

  function read(key){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}}
  function write(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){alert('手机存储空间可能不足，内容暂时无法保存。')}}
  function dateText(){return new Date().toLocaleString('zh-CN',{hour12:false})}
  function resizeCanvas(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  if('ResizeObserver' in window){new ResizeObserver(resizeCanvas).observe(canvasBox)}else{window.addEventListener('resize',resizeCanvas)}
  resizeCanvas();

  function releaseThought(){
    const text=input.value.trim(); if(!text)return;
    const w=canvas.clientWidth,h=canvas.clientHeight;
    const x=Math.random()*Math.max(1,w-100)+50,y=h-35;
    const colors=['#f2bcd2','#b9dce6','#d1c1e7','#efd2bd','#cbdcbd'];
    stars.push({x,y,text,size:Math.random()*3+2.5,speedY:-(Math.random()*.8+.5),speedX:(Math.random()-.5)*.3,opacity:1,twinkle:Math.random()*Math.PI*2,color:colors[Math.floor(Math.random()*colors.length)]});
    const archive=read(STORE.saved);archive.unshift({id:Date.now()+Math.random(),text,time:dateText()});write(STORE.saved,archive.slice(0,200));
    showFloatText(text,x,y);input.value='';input.focus();
  }
  $('releaseBtn').addEventListener('click',releaseThought);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')releaseThought()});
  function showFloatText(text,x,y){
    const el=document.createElement('div');el.className='float-text';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';canvasBox.appendChild(el);setTimeout(()=>el.remove(),4000);
  }
  canvas.addEventListener('pointerdown',e=>{
    const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
    stars=stars.filter(s=>{if(Math.hypot(s.x-x,s.y-y)<32){burst(s.x,s.y,s.color);return false}return true});
  });
  function burst(x,y,color){for(let i=0;i<12;i++){const a=Math.PI*2*i/12;particles.push({x,y,vx:Math.cos(a)*(Math.random()*3+2),vy:Math.sin(a)*(Math.random()*3+2),life:1,size:Math.random()*2+1,color})}}
  function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${Math.max(0,a)})`}
  function drawStar(cx,cy,r,opacity,color){
    ctx.save();ctx.translate(cx,cy);ctx.beginPath();
    for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2===0?r:r*.46;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.closePath();ctx.fillStyle=rgba(color,opacity);ctx.shadowColor=color;ctx.shadowBlur=9;ctx.fill();ctx.restore();
  }
  function animate(){
    const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);
    stars.forEach(s=>{s.y+=s.speedY;s.x+=s.speedX;s.twinkle+=.05;if(s.y<50)s.opacity-=.005;drawStar(s.x,s.y,s.size*2,s.opacity*(.7+Math.sin(s.twinkle)*.3),s.color)});
    stars=stars.filter(s=>s.opacity>0&&s.y>-50);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life-=.02;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle=rgba(p.color,p.life);ctx.fill()});
    particles=particles.filter(p=>p.life>0);requestAnimationFrame(animate);
  }
  animate();

  const quotes=['你不必今天就把所有事情想明白。','慢一点也没关系，你已经走了很远。','允许自己有情绪，也允许自己好好休息。','今天的你，也值得被温柔对待。','心事可以暂时放在这里，不用急着给出答案。','愿你在忙乱的日子里，也能留一点时间给自己。'];
  function openPanel(name){
    overlay.classList.add('show');document.querySelectorAll('.dock-button').forEach(b=>b.classList.toggle('active',b.dataset.open===name));
    if(name==='plugins')renderPlugins();else if(name==='diary')renderDiary();else if(name==='saved')renderSaved();else if(name==='letter')renderLetter();else if(name==='quote')renderQuote();
  }
  function renderPlugins(){
    panelTitle.textContent='我的小插件';
    panelBody.innerHTML=`<div class="plugin-grid">
      <button class="plugin-card" data-plugin="diary"><span class="big">📖</span><strong>心情日记</strong><small>花园 + 温柔时光</small></button>
      <button class="plugin-card" data-plugin="saved"><span class="big">⭐</span><strong>星星收藏</strong><small>收好放飞的心事</small></button>
      <button class="plugin-card" data-plugin="letter"><span class="big">💌</span><strong>时光信箱</strong><small>写给未来的自己</small></button>
      <button class="plugin-card" data-plugin="quote"><span class="big">🌷</span><strong>今日寄语</strong><small>抽一段温柔的话</small></button>
      <button class="plugin-card" data-plugin="home"><span class="big">✦</span><strong>回到树洞</strong><small>继续放飞心事</small></button>
    </div><p class="note">这些小功能都在同一个网页里，不是浏览器扩展。点开一个，就像打开一个小窗口。</p>`;
    panelBody.querySelectorAll('[data-plugin]').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.plugin;if(n==='home'){closePanel();return}openPanel(n)}));
  }
  function renderDiary(){
    panelTitle.textContent='📖 心情日记';
    panelBody.innerHTML=`<textarea id="diaryInput" maxlength="2000" placeholder="今天发生了什么？此刻的心情是什么？"></textarea><div class="action-row"><button class="primary" id="saveDiary">保存日记</button><button class="secondary" id="backPlugins">返回小插件</button></div><div class="note">日记只保存在当前浏览器的本机存储中。清理浏览器数据可能会让它消失。</div><div style="height:14px"></div><div class="list" id="diaryList"></div>`;
    const list=$('diaryList');
    let items=read(STORE.diary).map(x=>({id:x.id,time:x.time,text:x.text,_own:true}));
    // 「温柔时光」里写的日记也汇进来，两边不再各记各的
    try{
      const c=JSON.parse(localStorage.getItem('yoyo_combined_data')||'null');
      ((c&&c.diaries)||[]).forEach(d=>items.push({id:'love_'+d.time,time:d.date||'',
        text:(d.title&&d.title!=='无题'?d.title+'：':'')+(d.content||''),_own:false,_from:'温柔时光'}));
    }catch(e){}
    items.sort((a,b)=>(new Date(b.time||0).getTime()||0)-(new Date(a.time||0).getTime()||0));
    if(!items.length)list.innerHTML='<div class="empty">这里还空空的，写下第一篇日记吧。</div>';
    else items.forEach(item=>{
      const el=document.createElement('article');el.className='entry';
      const time=document.createElement('time');time.textContent=(item._from?item._from+' · ':'')+item.time;
      const body=document.createElement('div');body.textContent=item.text;
      const actions=document.createElement('div');actions.className='entry-actions';
      if(item._own){const del=document.createElement('button');del.textContent='删除';
        del.onclick=()=>{write(STORE.diary,read(STORE.diary).filter(x=>x.id!==item.id));renderDiary()};actions.append(del);}
      el.append(time,body,actions);list.append(el);
    });
    $('saveDiary').onclick=()=>{const text=$('diaryInput').value.trim();if(!text){alert('先写一点内容吧。');return}const a=read(STORE.diary);a.unshift({id:Date.now()+Math.random(),text,time:dateText()});write(STORE.diary,a);renderDiary()};
    $('backPlugins').onclick=renderPlugins;
  }
  function renderSaved(){
    panelTitle.textContent='⭐ 星星收藏';
    const items=read(STORE.saved);panelBody.innerHTML='<p class="note" style="margin:0 0 12px">每次放飞的心事都会在这里留下一份记录。点击画布上的星星只会让星星消失，不会删除收藏。</p><div class="list" id="savedList"></div><div class="action-row"><button class="secondary" id="backPlugins">返回小插件</button></div>';
    const list=$('savedList');
    if(!items.length)list.innerHTML='<div class="empty">还没有星星。写下一句话，送它上天吧。</div>';
    else items.forEach(item=>{const el=document.createElement('article');el.className='entry';const time=document.createElement('time');time.textContent=item.time;const body=document.createElement('div');body.textContent=item.text;const actions=document.createElement('div');actions.className='entry-actions';const del=document.createElement('button');del.textContent='删除收藏';del.onclick=()=>{write(STORE.saved,read(STORE.saved).filter(x=>x.id!==item.id));renderSaved()};actions.append(del);el.append(time,body,actions);list.append(el)});
    $('backPlugins').onclick=renderPlugins;
  }
  function renderLetter(){
    panelTitle.textContent='💌 时光信箱';
    panelBody.innerHTML=`<textarea id="letterInput" maxlength="3000" placeholder="亲爱的未来的我：&#10;&#10;想对以后的自己说些什么呢？"></textarea><div class="action-row"><button class="primary" id="saveLetter">把信收好</button><button class="secondary" id="backPlugins">返回小插件</button></div><div class="note">信件保存在这台设备的浏览器里。它不会自动发送给任何人。</div><div style="height:14px"></div><div class="list" id="letterList"></div>`;
    const items=read(STORE.letters),list=$('letterList');
    if(!items.length)list.innerHTML='<div class="empty">信箱还没有信件。</div>';
    else items.forEach(item=>{const el=document.createElement('article');el.className='entry';const time=document.createElement('time');time.textContent=item.time;const body=document.createElement('div');body.style.whiteSpace='pre-wrap';body.textContent=item.text;const actions=document.createElement('div');actions.className='entry-actions';const del=document.createElement('button');del.textContent='销毁这封信';del.onclick=()=>{write(STORE.letters,read(STORE.letters).filter(x=>x.id!==item.id));renderLetter()};actions.append(del);el.append(time,body,actions);list.append(el)});
    $('saveLetter').onclick=()=>{const text=$('letterInput').value.trim();if(!text){alert('先写一封信吧。');return}const a=read(STORE.letters);a.unshift({id:Date.now()+Math.random(),text,time:dateText()});write(STORE.letters,a);renderLetter()};
    $('backPlugins').onclick=renderPlugins;
  }
  function renderQuote(){
    panelTitle.textContent='🌷 今日寄语';
    const q=quotes[Math.floor(Math.random()*quotes.length)];
    panelBody.innerHTML=`<div class="quote-card" id="quoteText"></div><div class="action-row"><button class="primary" id="anotherQuote">再抽一句</button><button class="secondary" id="backPlugins">返回小插件</button></div>`;
    $('quoteText').textContent='“'+q+'”';$('anotherQuote').onclick=renderQuote;$('backPlugins').onclick=renderPlugins;
  }
  function closePanel(){overlay.classList.remove('show');document.querySelectorAll('.dock-button').forEach(b=>b.classList.toggle('active',b.dataset.open==='home'))}
  $('closePanel').addEventListener('click',closePanel);
  overlay.addEventListener('click',e=>{if(e.target===overlay)closePanel()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
  document.querySelectorAll('.dock-button').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.open;if(n==='home'){closePanel()}else openPanel(n)}));
})();
</script>
</body>
</html>
